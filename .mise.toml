# Project toolchain. `mise install` provisions everything `make check` needs.
#
# Versions are pinned rather than floating: the formatters in particular are
# style-defining, and an unpinned ruff silently reformats the tree when the
# machine's version moves. Nix (flake.nix) still drives CI and release builds.

[tools]
rust = { version = "1.97.1", components = "rustfmt,clippy" }
uv = "0.12.1"
bun = "1.3.14"
ruff = "0.16.0"

[env]
# Keep uv's managed interpreters inside the workspace cache.
UV_PYTHON_PREFERENCE = "managed"
